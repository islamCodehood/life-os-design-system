name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: node scripts/static-check.mjs
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build-storybook
      - run: pnpm build

  visual-regression:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build-storybook
      - run: pnpm exec playwright install --with-deps chromium
      - name: Compare or establish visual baselines
        shell: bash
        run: |
          SNAPSHOT_DIR="tests/visual-regression.spec.ts-snapshots"
          if [ ! -d "$SNAPSHOT_DIR" ]; then
            echo "No committed baselines yet. Establishing V3.3 baselines."
            pnpm visual:update
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$SNAPSHOT_DIR"
            if [ -f pnpm-lock.yaml ]; then git add pnpm-lock.yaml; fi
            git commit -m "test: establish V3.3 visual baselines [skip ci]"
            git push origin "HEAD:${{ github.head_ref || github.ref_name }}"
          else
            pnpm visual:test
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-regression-report
          path: |
            playwright-report
            test-results
