name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: node scripts/static-check.mjs
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build-storybook
      - run: pnpm build
